name: remind_app
description: >-
  Demonstration app for the remind ecosystem. Exercises remind_core and
  remind_notifications against a real device, with no location dependency at
  all — the configuration most applications embedding reminders actually want.
publish_to: none
version: 0.1.0

environment:
  flutter: '>=3.19.0'
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  native_geofence: ^1.3.1
  # Pinned below 13. permission_handler_android 14.0.0 ships a
  # build.gradle.kts that fails to compile against this project's Gradle and
  # Kotlin setup ("Unresolved reference: compilerOptions"). 12.x builds fine
  # and exposes exactly the one thing needed here.
  permission_handler: ^12.0.3
  remind_core: ^0.1.0
  remind_geofence: ^0.1.0
  remind_notifications: ^0.1.0
  shared_preferences: ^2.5.5
  timezone: '>=0.10.0 <0.12.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

# remind_core and remind_notifications resolve from pub.dev exactly as anyone
# else's app would, which is what makes this a real test of the published
# artefacts. remind_geofence is not published yet; this block goes when it is.
dependency_overrides:
  remind_geofence:
    path: ../remind_geofence

flutter:
  uses-material-design: true
