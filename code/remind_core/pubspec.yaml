name: remind_core
description: >-
  Pure Dart reminder engine. Models triggers by date, time, weekday and
  location, and resolves their occurrences with correct time zone and DST
  handling. No Flutter or platform dependencies.
version: 0.1.0
repository: https://github.com/ccisnedev/remind
issue_tracker: https://github.com/ccisnedev/remind/issues

environment:
  sdk: ^3.6.0

dependencies:
  collection: ^1.19.0
  meta: ^1.16.0
  # Rango amplio a propósito: flutter_local_notifications 22.x exige ^0.11.0,
  # pero hay apps aún en 0.10.x. El core no debe forzar la migración de nadie.
  timezone: '>=0.10.0 <0.12.0'

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
