name: CI

# Each package under `code/` is self-contained, so every job scopes itself to
# one package directory. Adding a package means adding it to the matrix of the
# job matching its toolchain — there is no workspace root resolving them
# together.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dart-package:
    name: dart / ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - remind_core
    defaults:
      run:
        working-directory: code/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test

      - name: Check the package is publishable
        run: dart pub publish --dry-run

  flutter-package:
    name: flutter / ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - remind_notifications
          - remind_geofence
    defaults:
      run:
        working-directory: code/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  example:
    name: remind_core example
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/remind_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart run example/remind_core_example.dart
