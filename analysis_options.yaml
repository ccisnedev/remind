# Reglas de análisis compartidas por todo el monorepo.
# Cada paquete hereda de este archivo con:
#   include: ../../analysis_options.yaml
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # El core es una librería pública: la documentación de la API no es opcional.
    public_member_api_docs: warning
    # Un `todo` no debería poder colarse silenciosamente en un release.
    todo: info

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - directives_ordering
    - join_return_with_assignment
    - only_throw_errors
    - prefer_final_locals
    - prefer_single_quotes
    - public_member_api_docs
    - require_trailing_commas
    - sort_pub_dependencies
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_enums
    - use_super_parameters
